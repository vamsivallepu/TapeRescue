[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "taperescue"
version = "0.1.0"
description = "Recover BBC Micro 1200-baud cassette programs from multiple imperfect WAV captures"
readme = "TapeRescue-Kiro-Brief.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    # Only the server tests use httpx (through FastAPI's TestClient); the
    # server code does not import it, so it is not in the server extra.
    "httpx>=0.27",
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
taperescue = "taperescue.cli:main"

[tool.setuptools.packages.find]
include = ["taperescue", "taperescue.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The server/ package is not part of the taperescue wheel; make it importable in tests.
pythonpath = ["."]
addopts = "--import-mode=importlib"
